apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    // @expo/cli is nested under node_modules/expo (npm doesn't hoist it because
    // @expo/fingerprint also ships a `cli`), so require.resolve('@expo/cli') fails
    // from the project root and cliFile silently became the android/app DIRECTORY,
    // which broke the JS bundle task. Resolve the Expo CLI via expo's own bin.
    cliFile = new File(["node", "--print", "require.resolve('expo/bin/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * R8 on release builds: shrink, optimise and obfuscate.
 *
 * Off until now, which meant a larger AAB, no obfuscation, and — once
 * Crashlytics landed — no mapping file to make a stack trace readable. Keep
 * rules live in proguard-rules.pro; read the note at the top of that file
 * before reaching for this flag.
 */
def enableProguardInReleaseBuilds = true

// Opt-in escape hatch for a local, non-distributable release build.
def allowDebugSigning = (project.findProperty('allowDebugSigning') ?: 'false').toString().toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.purnazen"
    defaultConfig {
        applicationId "com.purnazen"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridable from CI: -PpurnazenVersionCode / -PpurnazenVersionName
        versionCode = (project.findProperty('purnazenVersionCode') ?: 1).toString().toInteger()
        // Falls back to package.json so a local build reports the same version
        // the JS bundle shows (src/config APP_VERSION reads the same file).
        versionName project.findProperty('purnazenVersionName') ?:
            new groovy.json.JsonSlurper().parse(file("../../package.json")).version
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Populated from environment variables in CI (see the
            // release-mobile workflow). When absent the config stays empty and
            // the release build type refuses to sign — see below.
            def storeFilePath = System.getenv("PURNAZEN_UPLOAD_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("PURNAZEN_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("PURNAZEN_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("PURNAZEN_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Sign with the real upload keystore, or do not sign at all.
            //
            // This used to fall back to signingConfigs.debug when the keystore
            // env var was unset, so a keyless `./gradlew assembleRelease`
            // produced a file named like a release, shaped like a release, and
            // signed with the Android debug key — whose private key ships with
            // the SDK and is known to everyone. Nothing about the artifact said
            // so. That is a build you can hand someone by accident.
            //
            // `-PallowDebugSigning=true` is the deliberate escape hatch for
            // smoke-testing a minified build locally; you have to ask for it by
            // name, and the build warns while it does it.
            def uploadStore = System.getenv("PURNAZEN_UPLOAD_STORE_FILE")
            if (uploadStore) {
                signingConfig signingConfigs.release
            } else if (allowDebugSigning) {
                logger.warn("WARNING: signing the release build with the DEBUG key " +
                            "(-PallowDebugSigning=true). This artifact must never be " +
                            "distributed or uploaded to Play.")
                signingConfig signingConfigs.debug
            } else {
                // Unsigned, and the task-graph check below fails the build
                // before it gets this far for a real release task.
                signingConfig null
            }
            // Without this a native crash (ML Kit, Hermes, JNI, the camera
            // stack) arrives as raw addresses. `mappingFileUploadEnabled` is on
            // by default for release; native symbols are not.
            if (file('google-services.json').exists()) {
                firebaseCrashlytics {
                    nativeSymbolUploadEnabled true
                }
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Fail a release build that has no upload keystore — but only when a release
// task is actually being run. Throwing during configuration instead would
// break `assembleDebug`, `tasks`, and IDE sync for every developer who does not
// have the keystore, which is all of them.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        t.project == project && t.name ==~ /(?i)(assemble|bundle|install)Release.*/
    }
    if (wantsRelease && !System.getenv("PURNAZEN_UPLOAD_STORE_FILE") && !allowDebugSigning) {
        throw new GradleException(
            "Release build requires the upload keystore.\n" +
            "  Set PURNAZEN_UPLOAD_STORE_FILE (plus PURNAZEN_UPLOAD_STORE_PASSWORD,\n" +
            "  PURNAZEN_UPLOAD_KEY_ALIAS, PURNAZEN_UPLOAD_KEY_PASSWORD), or pass\n" +
            "  -PallowDebugSigning=true to build a debug-signed artifact that must\n" +
            "  never be distributed."
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Google Play In-App Updates (InAppUpdateModule): Play's own update flow,
    // started from the in-app "Update" banner. Inert outside Play installs.
    implementation("com.google.android.play:app-update:2.1.0")

    // On-device scan quality gate (ScanQualityModule): bundled ML Kit face
    // detector — runs fully offline, no image ever leaves the device.
    implementation("com.google.mlkit:face-detection:16.1.7")
    implementation("androidx.exifinterface:exifinterface:1.3.7")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
// Firebase (push notifications). The Google Services plugin hard-fails without
// google-services.json, so it is only applied once the config file from the
// Firebase console has been dropped into android/app/. Until then the app
// builds and runs normally with device push disabled.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    // Crashlytics rides on the same config file. Kept inside this guard
    // so a checkout without google-services.json still builds.
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.lifecycle('google-services.json not found - Firebase push disabled for this build.')
}

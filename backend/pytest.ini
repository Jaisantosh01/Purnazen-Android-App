[pytest]
# Only `tests/` is the suite. `sandbox/` holds manual pipeline scripts that
# happen to be named test_*.py — they import cv2/mediapipe directly and are run
# by hand against sample images, not in CI. Without this, collection of the
# whole backend directory fails outright on any machine that hasn't installed
# the full CV stack, which takes the real suite down with it.
testpaths = tests

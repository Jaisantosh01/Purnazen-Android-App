apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    // @expo/cli is nested under node_modules/expo (npm doesn't hoist it because
    // @expo/fingerprint also ships a `cli`), so require.resolve('@expo/cli') fails
    // from the project root and cliFile silently became the android/app DIRECTORY,
    // which broke the JS bundle task. Resolve the Expo CLI via expo's own bin.
    cliFile = new File(["node", "--print", "require.resolve('expo/bin/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Windows only: react-native-gesture-handler 3.x codegen object paths exceed
    // MAX_PATH (260), and the ninja bundled with the default cmake 3.22.1 (ninja
    // 1.10.2) ignores the Windows LongPathsEnabled opt-in — the build dies with
    // "Filename longer than 260 characters". cmake >= 3.25 ships ninja 1.12+,
    // which honors it. Linux/macOS (incl. CI) keep the AGP default.
    //
    // The version is resolved from whatever the SDK actually has installed
    // rather than hard-pinned: the SDK manager replaces cmake point releases
    // (3.31.4 -> 3.31.6), and a pin to a removed version fails every build
    // with CXX1300 "CMake was not found in SDK".
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        def resolveSdkCmake = {
            def props = new Properties()
            def lp = rootProject.file('local.properties')
            if (lp.exists()) lp.withInputStream { props.load(it) }
            def sdkPath = props.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
            if (sdkPath == null) return null
            def versions = new File(sdkPath, 'cmake').listFiles()
                ?.findAll { it.isDirectory() && it.name ==~ /\d+\.\d+\.\d+/ }
                ?.collect { it.name.split('\\.').collect { p -> p.toInteger() } }
                ?.findAll { it[0] > 3 || (it[0] == 3 && it[1] >= 25) }
            if (!versions) return null
            return versions.sort().last().join('.')
        }
        def sdkCmake = resolveSdkCmake()
        if (sdkCmake != null) {
            externalNativeBuild {
                cmake {
                    version sdkCmake
                }
            }
        }
        // No cmake >= 3.25 in the SDK: fall back to the AGP default (3.22.1)
        // rather than failing configuration outright — long paths may still
        // break the build, but short-path setups keep working.
    }

    namespace "com.purnazen.admin"
    defaultConfig {
        applicationId "com.purnazen.admin"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridable from CI: -PpurnazenVersionCode / -PpurnazenVersionName
        versionCode = (project.findProperty('purnazenVersionCode') ?: 1).toString().toInteger()
        // Falls back to package.json so a local build reports the same version
        // the JS bundle shows (src/config APP_VERSION reads the same file).
        versionName project.findProperty('purnazenVersionName') ?:
            new groovy.json.JsonSlurper().parse(file("../../package.json")).version
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Populated from environment variables in CI (see the
            // release-mobile workflow). Left empty for local builds, which then
            // fall back to the debug key below.
            def storeFilePath = System.getenv("PURNAZEN_UPLOAD_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("PURNAZEN_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("PURNAZEN_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("PURNAZEN_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Use the real upload keystore when CI provides it; otherwise the
            // debug key so local `assembleRelease` still works without secrets.
            signingConfig System.getenv("PURNAZEN_UPLOAD_STORE_FILE") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
// Firebase (social sign-in). The Google Services plugin hard-fails without
// google-services.json, so it is only applied once the config file from the
// Firebase console has been dropped into android/app/. Until then the app
// builds and runs normally with social login disabled.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('google-services.json not found - Firebase disabled for this build.')
}

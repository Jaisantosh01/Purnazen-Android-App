name: CI

on:
  pull_request:
  push:
    branches: [prod, Development]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12, not 3.13: mediapipe/opencv/scikit-image only ship wheels for
          # Python <=3.12 (see requirements.txt). On 3.13 the CV stack fails to
          # install and the face-scan pipeline degrades to status='failed'.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install CV native libs (mirror backend/Dockerfile)
        # mediapipe dlopens libGLESv2.so.2/libEGL.so.1 and opencv needs libGL;
        # GitHub's ubuntu-24.04 image no longer ships them.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0 libgl1 libgles2 libegl1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    # All three apps, not just mobile-users: Doctor and Admin shipped for months
    # with no lint or type gate at all, which is how three byte-identical copies
    # of the same subsystem drifted apart unnoticed.
    name: Frontend — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-users, mobile-doctors, mobile-admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --passWithNoTests: mobile-doctors has no suite yet. The gate that
      # actually catches things there is tsc + eslint; this keeps the job green
      # rather than silently dropping the app from CI again.
      - name: Jest
        run: npx jest --ci --passWithNoTests

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src App.tsx

name: Deploy Backend (Azure Container Apps)

# Manual only. Builds the backend image in ACR and rolls the Container App to it,
# then blocks until /health is green. Auth is OIDC (federated) — no stored
# cloud secrets. Gate approvals via the "production" environment.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build/deploy (default: short commit SHA)"
        required: false
        type: string
      run_migrations:
        description: "Run alembic migrations on container start"
        required: true
        default: true
        type: boolean

# OIDC needs id-token: write. Everything else is read-only.
permissions:
  id-token: write
  contents: read

# Never let two backend deploys race.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: purnazen-backend

jobs:
  deploy:
    name: Build + deploy + validate
    runs-on: ubuntu-latest
    environment: production            # add required reviewers here for an approval gate
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="$(git rev-parse --short HEAD)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
            --image "${IMAGE_NAME}:latest" \
            --file backend/Dockerfile \
            backend

      - name: Deploy to Container App
        env:
          # Runtime config (sourced from repo secrets/vars); applied here because
          # the Container App control plane is configured during deploy, not
          # locally.
          REG_TOKEN: ${{ secrets.RELEASE_REGISTER_TOKEN }}
          SCANS_CONTAINER: ${{ vars.AZURE_SCANS_CONTAINER }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APP_SECRET_KEY: ${{ secrets.BACKEND_SECRET_KEY }}
          APP_JWT_SECRET_KEY: ${{ secrets.BACKEND_JWT_SECRET_KEY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          APP="${{ vars.BACKEND_CONTAINERAPP }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          # Face scan images live in their own container — the video container
          # (AZURE_BLOB_CONTAINER_NAME) is listed wholesale by the admin video
          # browser, so user uploads must never land there.
          EXTRA_ENV="AZURE_SCANS_CONTAINER_NAME=${SCANS_CONTAINER:-uploads}"

          # The image sets ENVIRONMENT=production, and a production process
          # refuses to boot on the placeholder signing keys committed in source
          # (app/core/config.py). Fail here, with a message naming the missing
          # secret, rather than rolling out a revision that crash-loops.
          MISSING=""
          [ -n "$APP_SECRET_KEY" ]     || MISSING="$MISSING BACKEND_SECRET_KEY"
          [ -n "$APP_JWT_SECRET_KEY" ] || MISSING="$MISSING BACKEND_JWT_SECRET_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secret(s):$MISSING — generate with 'openssl rand -hex 32'. The backend will not start without them."
            exit 1
          fi
          az containerapp secret set --name "$APP" --resource-group "$RG" \
            --secrets "app-secret-key=$APP_SECRET_KEY" "app-jwt-secret-key=$APP_JWT_SECRET_KEY" --output none
          EXTRA_ENV="$EXTRA_ENV ENVIRONMENT=production SECRET_KEY=secretref:app-secret-key JWT_SECRET_KEY=secretref:app-jwt-secret-key"

          # Empty is a valid, and the safe, value: no cross-origin browser
          # access. Only set it when an origin list is actually configured.
          if [ -n "$CORS_ORIGINS" ]; then
            EXTRA_ENV="$EXTRA_ENV CORS_ORIGINS=$CORS_ORIGINS"
          fi

          # Without Redis, rate limits are per-replica: the effective limit is
          # N x the configured value. Required before scaling past one replica.
          if [ -n "$REDIS_URL" ]; then
            az containerapp secret set --name "$APP" --resource-group "$RG" \
              --secrets "redis-url=$REDIS_URL" --output none
            EXTRA_ENV="$EXTRA_ENV REDIS_URL=secretref:redis-url"
          else
            echo "::warning::REDIS_URL secret not set — rate limits will be per-replica."
          fi

          if [ -n "$REG_TOKEN" ]; then
            # Store the CI register token as a Container App secret and reference it.
            az containerapp secret set --name "$APP" --resource-group "$RG" \
              --secrets "release-register-token=$REG_TOKEN" --output none
            EXTRA_ENV="$EXTRA_ENV RELEASE_REGISTER_TOKEN=secretref:release-register-token"
          fi
          if [ -n "$FIREBASE_SA_JSON" ]; then
            # One credential powers FCM push + social-login token verification
            # (see docs/FIREBASE.md). Same secretref pattern as above.
            az containerapp secret set --name "$APP" --resource-group "$RG" \
              --secrets "firebase-service-account-json=$FIREBASE_SA_JSON" --output none
            EXTRA_ENV="$EXTRA_ENV FIREBASE_SERVICE_ACCOUNT_JSON=secretref:firebase-service-account-json"
          fi
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
            --set-env-vars "RUN_MIGRATIONS=${{ inputs.run_migrations == true && '1' || '0' }}" $EXTRA_ENV \
            --output none
          echo "Image rolled out. Active revision:"
          az containerapp revision list \
            --name "${{ vars.BACKEND_CONTAINERAPP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?properties.active].{rev:name, created:properties.createdTime, replicas:properties.replicas}" \
            --output table

      - name: Validate /health
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.BACKEND_CONTAINERAPP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          URL="https://${FQDN}/health"
          echo "Probing ${URL}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Healthy after ${i} attempt(s)."
              echo "### ✅ Backend healthy — \`$URL\` returned 200" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt ${i}: HTTP ${CODE} — retrying in 10s"
            sleep 10
          done
          echo "### ❌ Backend did not become healthy" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Azure logout
        if: always()
        run: az logout || true


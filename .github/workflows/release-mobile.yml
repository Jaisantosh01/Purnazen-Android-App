name: Release Mobile Apps

# Manual only. Builds a signed AAB + APK for one or all apps, renames them
# purnazen-<app>-v<version>.(aab|apk), and publishes a GitHub Release per app.
# The AAB is what goes to Play; the APK is for internal QA sideloading only.
# The apps no longer self-update — Play owns distribution — so nothing here
# uploads a binary anywhere the apps can reach.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to release"
        required: true
        default: all
        type: choice
        options: [all, mobile-users, mobile-doctors, mobile-admin]
      version:
        description: "Marketing version, e.g. 1.0.0"
        required: true
        type: string
      version_code:
        description: "Override versionCode (optional; default is derived from the version — see the build step)"
        required: false
        type: string
      api_base_url:
        description: "Override backend base URL (optional; defaults to the API_BASE_URL repo variable). Not stored in source."
        required: false
        type: string
      release_notes:
        description: "Optional release notes (markdown)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        default: true
        type: boolean
      force_update:
        description: "Force users onto this version (non-dismissible in-app update banner pointing at the store)"
        required: false
        default: false
        type: boolean
      register_version:
        description: "Register this version with the backend so older builds show the update banner (needs RELEASE_REGISTER_TOKEN)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write          # create releases + tags

concurrency:
  group: release-mobile-${{ inputs.app }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      version_code: ${{ steps.code.outputs.version_code }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.app }}" = "all" ]; then
            echo 'matrix={"app":["mobile-users","mobile-doctors","mobile-admin"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"app":["${{ inputs.app }}"]}' >> "$GITHUB_OUTPUT"
          fi

      # versionCode used to be github.run_number. Play requires a strictly
      # increasing integer per package, *permanently* — and run_number is scoped
      # to the workflow file, resetting to 1 if the file is ever renamed or
      # recreated. A reset is unrecoverable: Play rejects every subsequent
      # upload until the counter climbs back past the highest code already
      # published.
      #
      # Derive it from the version instead: MAJOR*1000000 + MINOR*1000 + PATCH.
      # Deterministic (two runs of the same version produce the same code),
      # monotonic with the version, and it leaves room for 999 minors and 999
      # patches. 1.0.0 -> 1000000, 1.2.3 -> 1002003, 2.0.0 -> 2000000.
      - id: code
        env:
          OVERRIDE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            case "$OVERRIDE" in
              ''|*[!0-9]*) echo "::error::version_code must be a positive integer"; exit 1 ;;
            esac
            echo "version_code=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "versionCode overridden: $OVERRIDE"; exit 0
          fi
          VER="${{ inputs.version }}"
          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be MAJOR.MINOR.PATCH (got '$VER'), or pass version_code explicitly"; exit 1
          fi
          MAJ=${VER%%.*}; REST=${VER#*.}; MIN=${REST%%.*}; PAT=${REST#*.}
          if [ "$MIN" -gt 999 ] || [ "$PAT" -gt 999 ]; then
            echo "::error::minor/patch must be <= 999 for this versionCode scheme"; exit 1
          fi
          CODE=$(( MAJ * 1000000 + MIN * 1000 + PAT ))
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionCode for $VER -> $CODE"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    environment: production          # approval gate for store-bound artifacts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install JS dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Inject build-time config (.env — not committed, URL not in source)
        # The backend URL is NOT hardcoded in source. It is injected here at build
        # time via EXPO_PUBLIC_API_URL (Expo inlines it into the bundle) from the
        # API_BASE_URL repo variable (or the optional workflow override). The .env
        # is created only in the runner checkout and is git-ignored. APP_VERSION is
        # injected likewise so the in-app update check matches the Release tag.
        env:
          API_BASE_URL: ${{ inputs.api_base_url != '' && inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::No backend URL — set the API_BASE_URL repo variable or pass api_base_url"; exit 1
          fi
          {
            echo "EXPO_PUBLIC_API_URL=$API_BASE_URL"
            echo "EXPO_PUBLIC_APP_VERSION=${{ inputs.version }}"
          } > "${{ matrix.app }}/.env"
          echo "Injected EXPO_PUBLIC_API_URL (len=${#API_BASE_URL}) + APP_VERSION=${{ inputs.version }}"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed AAB + APK
        working-directory: ${{ matrix.app }}/android
        env:
          PURNAZEN_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          PURNAZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PURNAZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PURNAZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PpurnazenVersionName="${{ inputs.version }}" \
            -PpurnazenVersionCode=${{ needs.prepare.outputs.version_code }} \
            :app:bundleRelease :app:assembleRelease

      - name: Collect + rename artifacts
        id: artifacts
        run: |
          set -e
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          BASE="purnazen-${{ matrix.app }}-v${{ inputs.version }}"
          AAB=$(find "${{ matrix.app }}/android/app/build/outputs/bundle/release" -name '*.aab' | head -n1)
          APK=$(find "${{ matrix.app }}/android/app/build/outputs/apk/release" -name '*.apk' | head -n1)
          cp "$AAB" "$OUT/${BASE}.aab"
          cp "$APK" "$OUT/${BASE}.apk"
          ( cd "$OUT" && sha256sum "${BASE}.aab" "${BASE}.apk" > "${BASE}.sha256.txt" )
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "Built:"; ls -lh "$OUT"

      # R8 is on for release builds, so the mapping file is the only way a
      # Crashlytics stack trace (or a Play vitals one) is readable. The
      # Crashlytics Gradle plugin uploads it automatically, but keep a copy on
      # the Release too — Firebase retention is shorter than Play's.
      - name: Attach R8 mapping file
        run: |
          set -e
          MAP=$(find "${{ matrix.app }}/android/app/build/outputs/mapping/release" -name 'mapping.txt' | head -n1 || true)
          if [ -n "$MAP" ]; then
            cp "$MAP" "${{ steps.artifacts.outputs.dir }}/purnazen-${{ matrix.app }}-v${{ inputs.version }}-mapping.txt"
            echo "Attached $MAP"
          else
            echo "::warning::no mapping.txt found — is minifyEnabled off?"
          fi

      # NOTE: no actions/upload-artifact here on purpose. The signed AAB/APK +
      # sha256 are attached to the GitHub Release below (permanent, and NOT
      # counted against the Actions artifact storage quota). A duplicate
      # upload-artifact step previously accumulated ~2 GB across releases and
      # exhausted the org's Actions storage quota ("Artifact storage quota has
      # been hit"), which blocks all new uploads. Grab builds from the Release.

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app }}-v${{ inputs.version }}
          name: ${{ matrix.app }} v${{ inputs.version }}
          body: |
            Automated release of **${{ matrix.app }}** v${{ inputs.version }}
            (versionCode ${{ needs.prepare.outputs.version_code }}, commit ${{ github.sha }}).

            ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.artifacts.outputs.dir }}/*

      # Records the published version so older installs can show the "update
      # available" banner and deep-link to the store listing. Metadata only —
      # no binary leaves this runner for anywhere the apps can reach.
      - name: Register published version with backend
        if: ${{ inputs.register_version }}
        env:
          API_BASE_URL: ${{ inputs.api_base_url != '' && inputs.api_base_url || vars.API_BASE_URL }}
          REGISTER_TOKEN: ${{ secrets.RELEASE_REGISTER_TOKEN }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          FORCE_UPDATE: ${{ inputs.force_update }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTER_TOKEN:-}" ]; then
            echo "::warning::RELEASE_REGISTER_TOKEN not set — skipping version registration"; exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg slug "${{ matrix.app }}" --arg ver "${{ inputs.version }}" \
            --arg notes "$RELEASE_NOTES" \
            --argjson code "$VERSION_CODE" \
            --argjson forced "$FORCE_UPDATE" \
            '{appSlug:$slug, version:$ver, versionCode:$code, notes:$notes, forced:$forced}')
          curl -fsS -X POST "${API_BASE_URL%/}/api/v1/app-releases" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: ${REGISTER_TOKEN}" \
            -d "$PAYLOAD"
          echo "Registered v${{ inputs.version }} (code $VERSION_CODE)."

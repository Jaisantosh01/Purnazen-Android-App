name: Release Mobile Apps

# Manual only. Builds a signed AAB + APK for one or all apps, renames them
# purnazen-<app>-v<version>.(aab|apk), and publishes a GitHub Release per app.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to release"
        required: true
        default: all
        type: choice
        options: [all, mobile-users, mobile-doctors, mobile-admin]
      version:
        description: "Marketing version, e.g. 1.0.0"
        required: true
        type: string
      api_base_url:
        description: "Override backend base URL (optional; defaults to the API_BASE_URL repo variable). Not stored in source."
        required: false
        type: string
      release_notes:
        description: "Optional release notes (markdown)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        default: true
        type: boolean
      force_update:
        description: "Force users onto this version (non-dismissible in-app update prompt)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write          # create releases + tags

concurrency:
  group: release-mobile-${{ inputs.app }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.app }}" = "all" ]; then
            echo 'matrix={"app":["mobile-users","mobile-doctors","mobile-admin"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"app":["${{ inputs.app }}"]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    environment: production          # approval gate for store-bound artifacts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install JS dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Inject build-time config (.env — not committed, URL not in source)
        # The backend URL is NOT hardcoded in source. It is injected here at build
        # time via EXPO_PUBLIC_API_URL (Expo inlines it into the bundle) from the
        # API_BASE_URL repo variable (or the optional workflow override). The .env
        # is created only in the runner checkout and is git-ignored. APP_VERSION is
        # injected likewise so the in-app update check matches the Release tag.
        env:
          API_BASE_URL: ${{ inputs.api_base_url != '' && inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::No backend URL — set the API_BASE_URL repo variable or pass api_base_url"; exit 1
          fi
          {
            echo "EXPO_PUBLIC_API_URL=$API_BASE_URL"
            echo "EXPO_PUBLIC_APP_VERSION=${{ inputs.version }}"
          } > "${{ matrix.app }}/.env"
          echo "Injected EXPO_PUBLIC_API_URL (len=${#API_BASE_URL}) + APP_VERSION=${{ inputs.version }}"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build signed AAB + APK
        working-directory: ${{ matrix.app }}/android
        env:
          PURNAZEN_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          PURNAZEN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PURNAZEN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PURNAZEN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PpurnazenVersionName="${{ inputs.version }}" \
            -PpurnazenVersionCode=${{ github.run_number }} \
            :app:bundleRelease :app:assembleRelease

      - name: Collect + rename artifacts
        id: artifacts
        run: |
          set -e
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          BASE="purnazen-${{ matrix.app }}-v${{ inputs.version }}"
          AAB=$(find "${{ matrix.app }}/android/app/build/outputs/bundle/release" -name '*.aab' | head -n1)
          APK=$(find "${{ matrix.app }}/android/app/build/outputs/apk/release" -name '*.apk' | head -n1)
          cp "$AAB" "$OUT/${BASE}.aab"
          cp "$APK" "$OUT/${BASE}.apk"
          ( cd "$OUT" && sha256sum "${BASE}.aab" "${BASE}.apk" > "${BASE}.sha256.txt" )
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "Built:"; ls -lh "$OUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-v${{ inputs.version }}
          path: ${{ steps.artifacts.outputs.dir }}/*
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app }}-v${{ inputs.version }}
          name: ${{ matrix.app }} v${{ inputs.version }}
          body: |
            Automated release of **${{ matrix.app }}** v${{ inputs.version }}
            (versionCode ${{ github.run_number }}, commit ${{ github.sha }}).

            ${{ inputs.release_notes }}
            ${{ inputs.force_update && '<!-- purnazen:force-update -->' || '' }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.artifacts.outputs.dir }}/*


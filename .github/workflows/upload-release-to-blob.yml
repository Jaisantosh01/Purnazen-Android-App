name: Upload Release to Blob (OTA)

# Manual, decoupled from the release build. Takes the APK already attached to a
# published GitHub Release (tag `<app>-v<version>`), uploads it to the PRIVATE
# releases container, and registers the version with the backend so the in-app
# updater starts serving it (short-lived SAS downloads). Use it to backfill
# releases that were published with upload_to_blob turned off.
#
# Requires: the CI principal must hold "Storage Blob Data Contributor" on the
# storage account (Contributor alone is control-plane and cannot write blobs).
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App slug (release tag is <app>-v<version>)"
        required: true
        type: choice
        options: [mobile-users, mobile-doctors, mobile-admin]
      version:
        description: "Version of an already-published release, e.g. 1.0.4"
        required: true
        type: string
      version_code:
        description: "versionCode baked into that APK (auto-parsed from the release notes when left empty)"
        required: false
        type: string
      force_update:
        description: "Force users onto this version (non-dismissible in-app update prompt)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read           # download the release asset + notes
  id-token: write          # OIDC federated login to Azure

concurrency:
  group: upload-release-${{ inputs.app }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload + register ${{ inputs.app }} v${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download APK + notes from the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.app }}-v${{ inputs.version }}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir "$RUNNER_TEMP/rel"
          APK=$(find "$RUNNER_TEMP/rel" -name '*.apk' | head -n1)
          [ -n "$APK" ] || { echo "::error::No APK asset on release $TAG"; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body \
            > "$RUNNER_TEMP/notes.md"

          CODE="${{ inputs.version_code }}"
          if [ -z "$CODE" ]; then
            # The release body states "(versionCode NNN, commit ...)".
            CODE=$(grep -oE 'versionCode [0-9]+' "$RUNNER_TEMP/notes.md" | head -n1 | grep -oE '[0-9]+' || true)
          fi
          [ -n "$CODE" ] || { echo "::error::versionCode not given and not found in the release notes"; exit 1; }

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Found $APK (versionCode $CODE)"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload APK to private releases container + register version
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          CONTAINER: ${{ vars.AZURE_RELEASES_CONTAINER }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REGISTER_TOKEN: ${{ secrets.RELEASE_REGISTER_TOKEN }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"; VER="${{ inputs.version }}"
          CONTAINER="${CONTAINER:-app-releases}"
          BASE="purnazen-${APP}-v${VER}"
          APK="${{ steps.release.outputs.apk }}"
          BLOB="releases/${APP}/${VER}/${BASE}.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')

          echo "Uploading $APK -> $CONTAINER/$BLOB"
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$CONTAINER" \
            --name "$BLOB" --file "$APK" \
            --auth-mode login --overwrite true \
            --content-type application/vnd.android.package-archive

          echo "Registering v$VER with backend"
          PAYLOAD=$(jq -n \
            --arg slug "$APP" --arg ver "$VER" --arg path "$BLOB" \
            --arg sha "$SHA" --rawfile notes "$RUNNER_TEMP/notes.md" \
            --argjson code ${{ steps.release.outputs.code }} \
            --argjson forced ${FORCE_UPDATE} \
            '{appSlug:$slug, version:$ver, apkBlobPath:$path, versionCode:$code, sha256:$sha, notes:$notes, forced:$forced}')
          curl -fsS -X POST "${API_BASE_URL%/}/api/v1/app-releases" \
            -H "Content-Type: application/json" \
            -H "X-Release-Token: ${REGISTER_TOKEN}" \
            -d "$PAYLOAD"
          echo "Registered."

      - name: Azure logout
        if: always()
        run: az logout || true

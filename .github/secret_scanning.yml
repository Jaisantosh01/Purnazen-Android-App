# Firebase client config files are public by design: the API key inside them is
# an app identifier, not a credential, and it ships inside every APK/IPA we
# publish. Google documents this explicitly. Keeping them committed is what
# lets CI build without a secret-injection step.
#
# What actually protects the project is restricting the key (bundle id /
# package + SHA-1, plus a minimal API allowlist) in the Google Cloud console,
# and the backend verifying every Firebase ID token itself. See
# docs/FIREBASE.md section 5, and run scripts/check-api-key-restrictions.sh
# to prove the restrictions are live.
#
# Without this file GitHub reopens a "Google API Key" alert on every commit
# that touches one of them.
paths-ignore:
  - "**/GoogleService-Info.plist"
  - "**/google-services.json"
